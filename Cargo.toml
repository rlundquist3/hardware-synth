[workspace]
resolver = "3"
members = ["hardware-synth-interface", "logger", "synth-core"]

[profile.release]
panic = "abort"
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false

# cargo build/run
[profile.dev]
panic = "abort"
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true
