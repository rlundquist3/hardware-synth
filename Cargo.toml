[package]
name = "hardware-synth"
version = "0.1.0"
edition = "2024"
authors = ["Riley Lundquist"]
license = "MIT"



[dependencies]
cortex-m = { version = "0.7.8", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = { version = "0.7.6", features = ["device"] }
daisy-embassy = { version = "0.3.0", features = ["seed3"] }
defmt = "1.1.1"
defmt-rtt = "1.3.0"
emballoc = "0.3.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-futures = { version = "0.1.2" }
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32h750ib", "time-driver-tim5", "exti", "memory-x", "unstable-pac", "chrono"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768", "generic-queue-8"] }
micromath = "2.1.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }


[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true